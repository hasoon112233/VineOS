# Beast APK — cloud build for the VineOS Beast fork.
#
# HOW TO INSTALL (phone, GitHub web UI):
#   1. Open your fork: github.com/hasoon112233/VineOS
#   2. Tap "Add file" -> "Create new file"
#   3. Name it exactly: .github/workflows/build-beast.yml
#   4. Paste this whole file, then "Commit changes"
#   5. Go to the "Actions" tab -> "Beast APK" -> "Run workflow"
#   6. When it finishes, the APK is in the "beast-apk" release + artifacts.
#
# The workflow builds the Beast source tarball (prepared by the developer),
# NOT the fork's own source, so no git pushes are needed to iterate.

name: Beast APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Beast source tarball
        run: |
          mkdir -p beast
          curl -fsSL -o /tmp/beast.tar.gz "https://muse.ai/files/1309900792215384/1402856011509616/g50h77w1n7oob5py6r09qsvm/vineos-beast.tar.gz"
          tar xzf /tmp/beast.tar.gz -C beast --strip-components=1
          ls beast
          chmod +x beast/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        working-directory: beast
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: beast-apk
          path: beast/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish to beast-apk release
        working-directory: beast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          gh release view beast-apk >/dev/null 2>&1 \
            || gh release create beast-apk --title "Beast APK" --notes "Automated Beast build of the VineOS fork"
          gh release upload beast-apk "$APK" --clobber
          echo "APK published to the beast-apk release"
